name: Build with foam-extend-4.0
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
  pull_request:
    branches-ignore:
      - 'OpenFOAM*'
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
jobs:
  build-fe40:
    runs-on: ubuntu-latest
    steps:
    - uses: gacts/install-podman@v1
    - name: Check out repository
      run: cd /tmp; git clone https://github.com/precice/foam-extend-adapter foam-extend-adapter
    - name: Check out branch
      run: cd /tmp/foam-extend-adapter; git checkout foam-extend-4.0
    - name: Build OpenFOAM-preCICE adapter
      run: cd /tmp/foam-extend-adapter/docker; ./test_fe40.sh
