name: Build with foam-extend-4.1
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
  pull_request:
    branches-ignore:
      - 'OpenFOAM*'
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
jobs:
  build-fe41:
    runs-on: ubuntu-latest
    steps:
    - uses: gacts/install-podman@v1
    - uses: actions/checkout@v4
    - name: Build OpenFOAM-preCICE adapter
      run: cd docker; ./test_fe41.sh
